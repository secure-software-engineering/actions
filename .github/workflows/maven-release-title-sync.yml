name: Maven Release Title Sync (reusable)

on:
  workflow_call:
    inputs:
      java_version:
        description: 'Java version to use for the Maven build'
        required: false
        type: string
        default: '17'
      java_distribution:
        description: 'Java distribution to use for the Maven build'
        required: false
        type: string
        default: 'zulu'
      tag_pattern:
        description: 'Pattern used to form git tags/release names from the version, using {major}/{minor}/{patch} placeholders (e.g. "v{major}.{minor}.{patch}" -> v1.2.3). Use "{major}.{minor}.{patch}" for unprefixed tags.'
        required: false
        type: string
        default: 'v{major}.{minor}.{patch}'
    secrets:
      release_pat:
        description: 'PAT used to check out and push the amended release branch. The default GITHUB_TOKEN is typically blocked by branch protection.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-title-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Recompute release version from title tag
    # head.repo check rejects fork PRs pretending to be our own release branches -
    # legitimate release/prep-* branches are always pushed by our own automation into this repo.
    if: >
      startsWith(github.head_ref, 'release/prep-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.release_pat }} # default GITHUB_TOKEN is blocked by branch protection
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: 'maven'

      - name: Parse release type tag from title
        id: parsed
        run: |
          set -euo pipefail
          FOUND=()
          shopt -s nocasematch
          [[ "$TITLE" == *"[major]"* ]] && FOUND+=("major")
          [[ "$TITLE" == *"[minor]"* ]] && FOUND+=("minor")
          [[ "$TITLE" == *"[patch]"* ]] && FOUND+=("patch")

          if [[ ${#FOUND[@]} -gt 1 ]]; then
            echo "PR title contains conflicting version tags: ${FOUND[*]}. Use only one of [major]/[minor]/[patch]." >&2
            exit 1
          elif [[ ${#FOUND[@]} -eq 1 ]]; then
            echo "release_type=${FOUND[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "PR title must contain exactly one of [major]/[minor]/[patch]." >&2
            exit 1
          fi

      - name: Fetch tags
        run: git fetch --tags

      - name: Resolve latest version matching tag_pattern
        id: latest
        uses: secure-software-engineering/actions/release/lib/resolve-latest-version@develop
        with:
          pattern: ${{ inputs.tag_pattern }}

      - name: Recompute release version from latest tag
        id: version
        env:
          RELEASE_TYPE: ${{ steps.parsed.outputs.release_type }}
          FOUND: ${{ steps.latest.outputs.found }}
          MAJOR: ${{ steps.latest.outputs.major }}
          MINOR: ${{ steps.latest.outputs.minor }}
          PATCH: ${{ steps.latest.outputs.patch }}
        run: |
          set -euo pipefail

          if [[ "$FOUND" != "true" ]]; then
            echo "No existing tag matching pattern '${{ inputs.tag_pattern }}' found in repo" >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            major) RELEASE_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) RELEASE_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) RELEASE_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Amend release branch if version changed
        env:
          ACTOR: ${{ github.actor }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config --global user.email "${ACTOR}@users.noreply.github.com"
          git config --global user.name "$ACTOR"

          CURRENT_VERSION=$(mvn -ntp org.apache.maven.plugins:maven-help-plugin:2.1.1:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | grep -v '^\[' | tail -1)

          if [[ "$CURRENT_VERSION" == "$RELEASE_VERSION" ]]; then
            echo "Release version already up to date ($CURRENT_VERSION)."
            exit 0
          fi

          echo "Updating release branch from $CURRENT_VERSION to $RELEASE_VERSION"
          mvn -B -ntp build-helper:parse-version versions:set -DnewVersion="$RELEASE_VERSION" versions:commit
          git ls-files | grep 'pom.xml$' | xargs git add
          git commit --amend -am "release $RELEASE_VERSION"
          git push --force origin HEAD:"$HEAD_REF"
