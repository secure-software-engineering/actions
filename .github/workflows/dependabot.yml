name: Handle Dependabot PRs

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  ApproveAndMerge:
    name: Auto approve Dependabot PRs
    runs-on: ubuntu-latest
    # Only run for PRs created by Dependabot - extended verification is done in the reusable action
    if: github.actor == 'dependabot[bot]'
    # These permissions are needed to approve pull requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto approve and merge Dependabot PR
        uses: ./dependabot
        with:
          token: ${{ secrets.AUTO_MERGE_PAT }}
