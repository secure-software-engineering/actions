name: Maven Release Prepare (reusable)

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Release type (major, minor, patch)'
        required: true
        type: string
      head_branch:
        description: 'Branch to release from and open the release PR against'
        required: false
        type: string
        default: 'develop'
      java_version:
        description: 'Java version to use for the Maven build'
        required: false
        type: string
        default: '17'
      java_distribution:
        description: 'Java distribution to use for the Maven build'
        required: false
        type: string
        default: 'zulu'
      tag_pattern:
        description: 'Pattern used to form git tags/release names from the version, using {major}/{minor}/{patch} placeholders (e.g. "v{major}.{minor}.{patch}" -> v1.2.3). Use "{major}.{minor}.{patch}" for unprefixed tags.'
        required: false
        type: string
        default: 'v{major}.{minor}.{patch}'
    secrets:
      release_pat:
        description: 'PAT used to check out, push the release branch and open the PR. The default GITHUB_TOKEN is typically blocked by branch protection or cannot trigger downstream workflows.'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Open release PR against ${{ inputs.head_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ inputs.head_branch }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.release_pat }}
          ref: ${{ inputs.head_branch }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}
          cache: 'maven'

      - name: Resolve latest version matching tag_pattern
        id: latest
        uses: secure-software-engineering/actions/release/lib/resolve-latest-version@develop
        with:
          pattern: ${{ inputs.tag_pattern }}

      - name: Determine initial release version from latest tag
        id: version
        env:
          FOUND: ${{ steps.latest.outputs.found }}
          MAJOR: ${{ steps.latest.outputs.major }}
          MINOR: ${{ steps.latest.outputs.minor }}
          PATCH: ${{ steps.latest.outputs.patch }}
        run: |
          set -euo pipefail

          if [[ "$FOUND" != "true" ]]; then
            echo "No existing tag matching pattern '${{ inputs.tag_pattern }}' found in repo" >&2
            exit 1
          fi

          LATEST_VERSION="$MAJOR.$MINOR.$PATCH"

          case "${{ inputs.release_type }}" in
            major) RELEASE_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) RELEASE_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) RELEASE_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            *)
              echo "Unknown release_type '${{ inputs.release_type }}'" >&2
              exit 1
              ;;
          esac

          echo "Latest released version: $LATEST_VERSION -> proposed $RELEASE_VERSION (${{ inputs.release_type }})"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          IFS='.' read -r REL_MAJOR REL_MINOR REL_PATCH <<< "$RELEASE_VERSION"
          echo "major=$REL_MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$REL_MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$REL_PATCH" >> "$GITHUB_OUTPUT"

      - name: Create release branch and bump version
        id: branch
        run: |
          set -euo pipefail
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

          RELEASE_BRANCH="release/prep-${{ github.run_id }}"
          git checkout -b "$RELEASE_BRANCH"
          mvn -B -ntp build-helper:parse-version versions:set -DnewVersion="${{ steps.version.outputs.release_version }}" versions:commit
          git ls-files | grep 'pom.xml$' | xargs git add
          git commit -am "release ${{ steps.version.outputs.release_version }}"
          # --force: RELEASE_BRANCH is deterministic (tied to run_id) and owned
          # exclusively by this workflow run. A "re-run failed jobs" retry after a
          # later step failed (e.g. PR creation) recreates this commit with a new
          # SHA - a plain push would be rejected as non-fast-forward against the
          # branch left over from the earlier attempt.
          git push --force origin "$RELEASE_BRANCH"

          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Format the proposed release tag (for the PR body only)
        id: tag
        uses: secure-software-engineering/actions/release/lib/format-version-tag@develop
        with:
          pattern: ${{ inputs.tag_pattern }}
          major: ${{ steps.version.outputs.major }}
          minor: ${{ steps.version.outputs.minor }}
          patch: ${{ steps.version.outputs.patch }}

      - name: Open PR against ${{ inputs.head_branch }}
        env:
          GH_TOKEN: ${{ secrets.release_pat }}
        run: |
          gh pr create \
            -B "${{ inputs.head_branch }}" \
            -H "${{ steps.branch.outputs.release_branch }}" \
            -t "[${{ inputs.release_type }}] Release ${{ steps.version.outputs.release_version }}" \
            -b "Release candidate for \`${{ steps.version.outputs.release_version }}\`.

          To change the release type, edit the title's \`[${{ inputs.release_type }}]\` tag to \`[major]\`, \`[minor]\` or \`[patch]\` - the version and this branch update automatically.

          **This PR must be merged manually.** Merging it tags \`${{ steps.tag.outputs.tag }}\` (adjusted if you edited the type tag), deploys to Maven Central, and opens a follow-up PR advancing \`${{ inputs.head_branch }}\` to the next SNAPSHOT (that one auto-merges)."
